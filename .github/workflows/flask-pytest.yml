name: MyTemplate CI

on:
  push:
    branches:
      - devops-assessment
      - master
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Ruff
        run: |
          mkdir -p reports
          ruff check appname tests --output-format=json > reports/ruff-report.json

      - name: Show Ruff report
        if: always()
        run: cat reports/ruff-report.json

      - name: Bandit
        run: |
          bandit -r appname -f json -o reports/bandit-report.json

      - name: Backend tests and coverage
        env:
          APPNAME_ENV: test
        run: |
          mkdir -p reports/coverage
          pytest tests \
            --ignore=tests/ui \
            -v \
            --junitxml=reports/junit.xml \
            --cov=appname \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage/coverage.xml \
            --cov-report=html:reports/coverage/html

      - name: Start application
        env:
          APPNAME_ENV: test
        run: |
          nohup python manage.py server > app.log 2>&1 &
          sleep 10

      - name: Playwright UI tests
        run: |
          pytest tests/ui -v \
            --base-url=http://127.0.0.1:5000

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            reports/
            app.log